name: PON MVP build

concurrency:
  group: pon-mvp-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "app/mvp/**"
      - ".github/workflows/pon-mvp-build.yml"
  push:
    branches:
      - main
    paths:
      - "app/mvp/**"
      - ".github/workflows/pon-mvp-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  database-rls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase services
        working-directory: app/mvp
        run: supabase start -x studio,inbucket,imgproxy,edge-runtime,logflare,vector
      - name: Run database security tests
        working-directory: app/mvp
        run: supabase test db
